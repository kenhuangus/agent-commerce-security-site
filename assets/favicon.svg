<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0e14" />
      <stop offset="50%" stop-color="#121824" />
      <stop offset="100%" stop-color="#07090d" />
    </linearGradient>

    <!-- Border Ring Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6a2b" />
      <stop offset="50%" stop-color="#ffb454" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>

    <!-- Commerce Glow -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9d00" />
      <stop offset="100%" stop-color="#ff6a2b" />
    </linearGradient>

    <!-- Cyber Cyan Glow -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <!-- Drop Shadow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="12" />

  <!-- Inner Cyber Grid & Commerce Circuit Elements -->
  <!-- Circuit Nodes & Traces -->
  <path d="M 256 70 L 256 120" stroke="#00f2fe" stroke-width="6" stroke-linecap="round" opacity="0.6" />
  <circle cx="256" cy="65" r="8" fill="#00f2fe" />
  <path d="M 256 392 L 256 442" stroke="#ff6a2b" stroke-width="6" stroke-linecap="round" opacity="0.6" />
  <circle cx="256" cy="447" r="8" fill="#ff6a2b" />
  <path d="M 70 256 L 120 256" stroke="#ffb454" stroke-width="6" stroke-linecap="round" opacity="0.6" />
  <circle cx="65" cy="256" r="8" fill="#ffb454" />
  <path d="M 392 256 L 442 256" stroke="#00f2fe" stroke-width="6" stroke-linecap="round" opacity="0.6" />
  <circle cx="447" cy="256" r="8" fill="#00f2fe" />

  <!-- Outer Commerce Shield / Transaction Ring (Dual Rotating Chevrons / Cash Rail) -->
  <path d="M 256 120 A 136 136 0 0 1 392 256" fill="none" stroke="url(#cyanGrad)" stroke-width="20" stroke-linecap="round" />
  <polygon points="380,240 405,268 412,230" fill="#00f2fe" />

  <path d="M 256 392 A 136 136 0 0 1 120 256" fill="none" stroke="url(#goldGrad)" stroke-width="20" stroke-linecap="round" />
  <polygon points="132,272 107,244 100,282" fill="#ff6a2b" />

  <!-- Autonomous Agent Core: Central Shield & Neural AI Eye -->
  <!-- Inner Shield / Hexagon -->
  <polygon points="256,160 336,206 336,298 256,344 176,298 176,206" fill="#151d2c" stroke="#ffb454" stroke-width="8" stroke-linejoin="round" />

  <!-- Stylized "A" (Agent) & Dynamic Transaction Crossbar -->
  <!-- Outer A Frame -->
  <path d="M 210 310 L 256 195 L 302 310" fill="none" stroke="#ffffff" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Payment / Token Currency Bar in A -->
  <path d="M 195 268 L 317 268" stroke="url(#goldGrad)" stroke-width="16" stroke-linecap="round" />
  
  <!-- Glowing Center AI Sensor Core -->
  <circle cx="256" cy="235" r="14" fill="#00f2fe" filter="url(#glow)" />
  <circle cx="256" cy="235" r="7" fill="#ffffff" />
</svg>
